name: Bootstrap LyTIM from TIM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap LyTIM from TIM'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Import upstream TIM baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/yihengd/TIM.git /tmp/tim
          rsync -a --exclude='.git' /tmp/tim/ ./
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import upstream TIM baseline [skip ci]'
          git push origin HEAD:main
